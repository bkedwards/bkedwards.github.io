<div class="container" >
  <div class="experience-container">
    <div class="map-wrapper">
      <div #mapContainer class="map-container"></div>
    </div>

    <div class="panels-wrapper" [scrollTrapTo]="panelScroller">
      <div class="timeline">
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
        <div class="thick-tick"></div>
        <div class="tick"></div>
      </div>
      <div #panelScroller class="panels-container" >
      @for (experience of experiences; track experience.position; let i = $index) {

        <section class="panel" [attr.data-index]="i" [style.--icon-url]="'url(' + experience.icon + ')'">
          <div class="panel-interior">
            <h3>{{ experience.position }}</h3>
            <p><strong>{{ experience.company }}</strong> — {{ experience.location }}</p>
            <p>{{ experience.description }}</p>
            <p>{{ experience.date }}</p>
          </div>
        </section>
      }

      </div>
    </div>

  </div>
</div>
